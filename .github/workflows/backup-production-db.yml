name: Backup Production DB

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Run backup on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 2558
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ~/arsivinyo-memegy-backend/

            BACKUP_DIR="$HOME/memegy-backups/postgres"
            mkdir -p "$BACKUP_DIR"

            TS="$(date -u +%Y%m%dT%H%M%SZ)"
            BACKUP_FILE="$BACKUP_DIR/memegy_prod_${TS}.dump"

            docker exec memegy_prod_db sh -lc 'PGPASSWORD="$POSTGRES_PASSWORD" pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc --no-owner --no-privileges' > "$BACKUP_FILE"
            gzip -f "$BACKUP_FILE"

            find "$BACKUP_DIR" -type f -name "memegy_prod_*.dump.gz" -mtime +14 -delete

            ls -lh "$BACKUP_DIR" | tail -n 10
