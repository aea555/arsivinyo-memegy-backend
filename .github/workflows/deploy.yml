name: Deploy to VPS

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive image tags
        id: image
        run: |
          set -euo pipefail
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/arsivinyo-memegy-backend:dev-${GITHUB_SHA}"
          latest="ghcr.io/${owner}/arsivinyo-memegy-backend:dev-latest"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.image }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha,scope=memegy-backend
          cache-to: type=gha,mode=max,scope=memegy-backend

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Execute remote deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          BACKEND_IMAGE: ${{ needs.build_and_push.outputs.image }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: 2558
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: BACKEND_IMAGE
          command_timeout: 45m
          script: |
            set -euo pipefail
            cd ~/arsivinyo-memegy-backend/

            git fetch origin
            git checkout -f dev || git checkout -b dev origin/dev
            git reset --hard origin/dev

            touch .env.production
            PREVIOUS_BACKEND_IMAGE="$(grep -E '^BACKEND_IMAGE=' .env.production | head -n1 | cut -d= -f2- || true)"
            LAST_SUCCESSFUL_FILE=".last_successful_backend_image"
            LAST_SUCCESSFUL_IMAGE="$(cat "${LAST_SUCCESSFUL_FILE}" 2>/dev/null || true)"
            CURRENT_API_IMAGE="$(docker inspect -f '{{.Config.Image}}' memegy_prod_api 2>/dev/null || true)"
            CURRENT_WORKER_IMAGE="$(docker inspect -f '{{.Config.Image}}' memegy_prod_worker 2>/dev/null || true)"
            ROLLBACK_IMAGE="${LAST_SUCCESSFUL_IMAGE:-${CURRENT_API_IMAGE:-${CURRENT_WORKER_IMAGE:-${PREVIOUS_BACKEND_IMAGE}}}}"

            if [ "${ROLLBACK_IMAGE:-}" = "${BACKEND_IMAGE}" ]; then
              ROLLBACK_IMAGE=""
            fi

            if grep -qE '^BACKEND_IMAGE=' .env.production; then
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_IMAGE}|" .env.production
            else
              printf '\nBACKEND_IMAGE=%s\n' "${BACKEND_IMAGE}" >> .env.production
            fi

            rollback() {
              echo "Rolling back to previous image..."
              if [ -n "${ROLLBACK_IMAGE}" ]; then
                if grep -qE '^BACKEND_IMAGE=' .env.production; then
                  sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${ROLLBACK_IMAGE}|" .env.production
                else
                  printf '\nBACKEND_IMAGE=%s\n' "${ROLLBACK_IMAGE}" >> .env.production
                fi
              else
                echo "No rollback image available; skipping rollback."
                return 0
              fi

              docker compose -f docker-compose.production.yml --env-file .env.production pull api worker || true
              docker compose -f docker-compose.production.yml --env-file .env.production up -d --no-build --remove-orphans || true
            }

            fail_deploy() {
              echo "Deployment validation failed: $1"
              docker compose -f docker-compose.production.yml --env-file .env.production ps || true
              docker compose -f docker-compose.production.yml --env-file .env.production logs --tail=150 api worker || true
              rollback
              exit 1
            }

            docker compose -f docker-compose.production.yml --env-file .env.production config >/dev/null || fail_deploy "compose config invalid"
            docker compose -f docker-compose.production.yml --env-file .env.production pull api worker || fail_deploy "failed to pull image"
            docker compose -f docker-compose.production.yml --env-file .env.production up -d --no-build --remove-orphans || fail_deploy "failed to start updated services"

            # Ensure nginx picks up template changes before loopback health check.
            docker compose -f docker-compose.production.yml --env-file .env.production restart nginx || true
            sleep 10

            docker compose -f docker-compose.production.yml --env-file .env.production ps api worker || fail_deploy "ps check failed"

            api_running="$(docker inspect -f '{{.State.Running}}' memegy_prod_api 2>/dev/null || echo false)"
            worker_running="$(docker inspect -f '{{.State.Running}}' memegy_prod_worker 2>/dev/null || echo false)"
            [ "${api_running}" = "true" ] || fail_deploy "api container is not running"
            [ "${worker_running}" = "true" ] || fail_deploy "worker container is not running"

            if command -v curl >/dev/null 2>&1; then
              health_ok=0
              for _ in $(seq 1 10); do
                if curl -fsS http://127.0.0.1:8088/health >/dev/null; then
                  health_ok=1
                  break
                fi
                sleep 2
              done
              [ "${health_ok}" = "1" ] || fail_deploy "loopback health check failed"
            fi

            printf '%s\n' "${BACKEND_IMAGE}" > "${LAST_SUCCESSFUL_FILE}"
