services:
  db:
    networks:
      - memegy-network
    image: postgres:18.1-alpine3.23
    container_name: memegy_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${PROD_POSTGRES_DATA_DIR:-./data/prod/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    networks:
      - memegy-network
    image: valkey/valkey:9.0.1-alpine
    container_name: memegy_prod_cache
    restart: always
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    command: >
      /bin/sh -ec '
      test -n "$$VALKEY_PASSWORD";
      exec valkey-server --requirepass "$$VALKEY_PASSWORD" --protected-mode yes
      '
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ${PROD_VALKEY_DATA_DIR:-./data/prod/valkey}:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$${VALKEY_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    networks:
      - memegy-network
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: memegy_prod_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ${PROD_MINIO_DATA_DIR:-./data/prod/minio}:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    networks:
      - memegy-network
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    container_name: memegy_prod_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 '${MINIO_ROOT_USER}' '${MINIO_ROOT_PASSWORD}';
      /usr/bin/mc mb myminio/${MINIO_BUCKET_VIDEOS} || true;
      /usr/bin/mc mb myminio/${MINIO_BUCKET_RAW} || true;
      /usr/bin/mc anonymous set public myminio/${MINIO_BUCKET_VIDEOS};
      exit 0;
      "

  nginx:
    networks:
      - memegy-network
    image: nginx:1.28.1-alpine
    container_name: memegy_prod_nginx
    restart: always
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:Z
    environment:
      - NGINX_PORT=80
      - ENVIRONMENT=${ENVIRONMENT}
      - API_HOST=api
      - SERVER_PORT=${SERVER_PORT}
    depends_on:
      - api

  api:
    networks:
      - memegy-network
    image: ${BACKEND_IMAGE}
    pull_policy: always
    container_name: memegy_prod_api
    restart: always
    command: ["/app/api"]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Server
      RUST_LOG: ${RUST_LOG}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: ${ENVIRONMENT}
      REQUIRE_CLOUDFLARE_HEADERS: ${REQUIRE_CLOUDFLARE_HEADERS}

      # Token TTLs
      ACCESS_TOKEN_TTL_SECS: ${ACCESS_TOKEN_TTL_SECS}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}
      AUTH_REQUIRE_USERNAME_ON_GOOGLE_SIGNUP: ${AUTH_REQUIRE_USERNAME_ON_GOOGLE_SIGNUP:-true}
      TERMS_CURRENT_VERSION: ${TERMS_CURRENT_VERSION:-v1}
      TERMS_URL: ${TERMS_URL:-}
      TERMS_CONTENT: ${TERMS_CONTENT:-}
      TERMS_CONTENT_FILE_PATH: ${TERMS_CONTENT_FILE_PATH:-docs/legal/terms/memegy_terms_v1.md}
      TERMS_CONTENT_TYPE: ${TERMS_CONTENT_TYPE:-text/markdown}
      TERMS_REQUIRE_VERSION_MATCH: ${TERMS_REQUIRE_VERSION_MATCH:-true}
      TERMS_LEGAL_CONTACT_EMAIL: ${TERMS_LEGAL_CONTACT_EMAIL:-}
      TERMS_ABUSE_CONTACT_EMAIL: ${TERMS_ABUSE_CONTACT_EMAIL:-}
      TERMS_JURISDICTIONS: ${TERMS_JURISDICTIONS:-US,TR,GLOBAL}
      READ_ONLY_MODE_ENABLED: ${READ_ONLY_MODE_ENABLED:-false}
      MAINTENANCE_MODE_ENABLED: ${MAINTENANCE_MODE_ENABLED:-false}
      USERNAME_RESERVED_VALUES: ${USERNAME_RESERVED_VALUES:-admin,support,api,root,system,me,users,auth,feed,superuser,staff,moderator,manager,editor,superadmin,sysadmin,administrator,operator,dev,developer,qa,test,testing,contact,help,info,security,abuse,postmaster,webmaster,host}
      ADMIN_API_ENABLED: ${ADMIN_API_ENABLED:-false}
      ADMIN_JWT_ISSUER: ${ADMIN_JWT_ISSUER}
      ADMIN_JWT_AUDIENCE: ${ADMIN_JWT_AUDIENCE}
      ADMIN_JWT_PUBLIC_KEYS_JSON: ${ADMIN_JWT_PUBLIC_KEYS_JSON:-{}}
      ADMIN_JWT_MAX_TTL_SECS: ${ADMIN_JWT_MAX_TTL_SECS:-300}
      ADMIN_JWT_CLOCK_SKEW_SECS: ${ADMIN_JWT_CLOCK_SKEW_SECS:-60}
      ADMIN_REPLAY_PROTECTION_ENABLED: ${ADMIN_REPLAY_PROTECTION_ENABLED:-true}
      ADMIN_ALLOWED_IP_CIDRS: ${ADMIN_ALLOWED_IP_CIDRS}

      # Auth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH_REDIRECT_BASE_URL: ${OAUTH_REDIRECT_BASE_URL}
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-http://localhost:3000}
      MOBILE_APP_SCHEME: ${MOBILE_APP_SCHEME}

      # Database
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

      # Cache
      VALKEY_URL: redis://:${VALKEY_PASSWORD}@cache:6379

      # Storage
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_VIDEOS: ${MINIO_BUCKET_VIDEOS}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW}
      PRESIGNED_URL_EXPIRY_SECS: ${PRESIGNED_URL_EXPIRY_SECS}

      # Limits
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES}
      LIMIT_UPLOAD_BYTES_HOURLY: ${LIMIT_UPLOAD_BYTES_HOURLY}
      UPLOAD_SIZE_TOLERANCE_BYTES: ${UPLOAD_SIZE_TOLERANCE_BYTES:-0}
      MIN_VIDEO_SIZE_BYTES: ${MIN_VIDEO_SIZE_BYTES:-1024}
      LIMIT_FEED_RPM: ${LIMIT_FEED_RPM}
      RATE_LIMIT_WINDOW_SECS: ${RATE_LIMIT_WINDOW_SECS}
      IP_RATE_LIMIT_RPM: ${IP_RATE_LIMIT_RPM}
      LIKE_ACTIONS_RPM_LIMIT: ${LIKE_ACTIONS_RPM_LIMIT:-60}
      LIKE_ACTIONS_WINDOW_SECS: ${LIKE_ACTIONS_WINDOW_SECS:-60}
      OTC_RATE_LIMIT_MAX_ATTEMPTS: ${OTC_RATE_LIMIT_MAX_ATTEMPTS}
      OTC_RATE_LIMIT_WINDOW_SECONDS: ${OTC_RATE_LIMIT_WINDOW_SECONDS}
      USERNAME_SIGNUP_RPM_PER_IP: ${USERNAME_SIGNUP_RPM_PER_IP:-20}
      USERNAME_SIGNUP_ATTEMPTS_PER_TICKET: ${USERNAME_SIGNUP_ATTEMPTS_PER_TICKET:-10}
      USERNAME_UPDATE_RPM_PER_USER: ${USERNAME_UPDATE_RPM_PER_USER:-5}
      READ_ONLY_STATUS_RPM_PER_USER: ${READ_ONLY_STATUS_RPM_PER_USER:-20}
      MAINTENANCE_STATUS_RPM_PER_USER: ${MAINTENANCE_STATUS_RPM_PER_USER:-20}
      ONBOARDING_STATUS_RPM_PER_USER: ${ONBOARDING_STATUS_RPM_PER_USER:-30}
      ONBOARDING_COMPLETE_RPM_PER_USER: ${ONBOARDING_COMPLETE_RPM_PER_USER:-10}
      REPORT_CREATE_RPM_PER_USER: ${REPORT_CREATE_RPM_PER_USER:-10}
      REPORT_CREATE_RPM_PER_IP: ${REPORT_CREATE_RPM_PER_IP:-20}
      REPORT_DETAILS_MAX_CHARS: ${REPORT_DETAILS_MAX_CHARS:-2000}
      REPORT_REASON_MAX_COUNT: ${REPORT_REASON_MAX_COUNT:-5}
      AUTO_QUARANTINE_ENABLED: ${AUTO_QUARANTINE_ENABLED:-true}
      AUTO_QUARANTINE_WINDOW_SECS: ${AUTO_QUARANTINE_WINDOW_SECS:-1800}
      AUTO_QUARANTINE_SEVERE_DISTINCT_REPORTERS: ${AUTO_QUARANTINE_SEVERE_DISTINCT_REPORTERS:-2}
      SECURITY_EVENTS_RETENTION_DAYS: ${SECURITY_EVENTS_RETENTION_DAYS:-180}
      SECURITY_EVENTS_PURGE_INTERVAL_SECS: ${SECURITY_EVENTS_PURGE_INTERVAL_SECS:-86400}
      ABUSE_REPORT_RETENTION_DAYS: ${ABUSE_REPORT_RETENTION_DAYS:-365}
      ABUSE_REPORT_PURGE_INTERVAL_SECS: ${ABUSE_REPORT_PURGE_INTERVAL_SECS:-86400}
      BAN_USER_CACHE_NEGATIVE_TTL_SECS: ${BAN_USER_CACHE_NEGATIVE_TTL_SECS:-60}
      BAN_USER_CACHE_PERMANENT_TTL_SECS: ${BAN_USER_CACHE_PERMANENT_TTL_SECS:-21600}
      BAN_IP_CACHE_NEGATIVE_TTL_SECS: ${BAN_IP_CACHE_NEGATIVE_TTL_SECS:-60}
      BAN_IP_CACHE_PERMANENT_TTL_SECS: ${BAN_IP_CACHE_PERMANENT_TTL_SECS:-21600}
      BAN_IP_VERDICT_TTL_SECS: ${BAN_IP_VERDICT_TTL_SECS:-60}

      # Feed
      FEED_PAGE_SIZE: ${FEED_PAGE_SIZE}
      FEED_CACHE_TTL_SECS: ${FEED_CACHE_TTL_SECS}

      # Worker
      DRAFT_VIDEO_CLEANUP_HOURS: ${DRAFT_VIDEO_CLEANUP_HOURS}
      WORKER_RETRY_MAX_ATTEMPTS: ${WORKER_RETRY_MAX_ATTEMPTS}
      WORKER_RETRY_BACKOFF_BASE_SECS: ${WORKER_RETRY_BACKOFF_BASE_SECS}
      FFMPEG_TRANSCODE_TIMEOUT_SECS: ${FFMPEG_TRANSCODE_TIMEOUT_SECS:-180}
      FFMPEG_THUMBNAIL_TIMEOUT_SECS: ${FFMPEG_THUMBNAIL_TIMEOUT_SECS:-30}

      # Search
      SEARCH_MAX_TOKENS: ${SEARCH_MAX_TOKENS}
      SEARCH_MAX_TOKEN_LENGTH: ${SEARCH_MAX_TOKEN_LENGTH}
      SEARCH_MAX_QUERY_CHARS: ${SEARCH_MAX_QUERY_CHARS}
      SEARCH_TIMEOUT_SECS: ${SEARCH_TIMEOUT_SECS}
      SEARCH_CACHE_TTL_SECS: ${SEARCH_CACHE_TTL_SECS}
      SEARCH_RPM_LIMIT: ${SEARCH_RPM_LIMIT}
      VIDEO_WS_ENABLED: ${VIDEO_WS_ENABLED:-true}
      VIDEO_WS_MAX_CONN_PER_USER: ${VIDEO_WS_MAX_CONN_PER_USER:-3}
      VIDEO_WS_MAX_CONN_GLOBAL: ${VIDEO_WS_MAX_CONN_GLOBAL:-5000}
      VIDEO_WS_CONNECT_RPM_PER_IP: ${VIDEO_WS_CONNECT_RPM_PER_IP:-30}
      VIDEO_WS_CONNECT_RPM_PER_USER: ${VIDEO_WS_CONNECT_RPM_PER_USER:-60}
      VIDEO_WS_SEND_BUFFER: ${VIDEO_WS_SEND_BUFFER:-64}
      VIDEO_WS_HEARTBEAT_SECS: ${VIDEO_WS_HEARTBEAT_SECS:-20}

      # Download
      DOWNLOAD_RPM_LIMIT: ${DOWNLOAD_RPM_LIMIT}
      DOWNLOAD_BANDWIDTH_HOURLY_MB: ${DOWNLOAD_BANDWIDTH_HOURLY_MB}
      PRESIGNED_DOWNLOAD_URL_EXPIRY_SECS: ${PRESIGNED_DOWNLOAD_URL_EXPIRY_SECS}
      DOWNLOAD_REFRESH_RPM_LIMIT: ${DOWNLOAD_REFRESH_RPM_LIMIT}

      # Bulk Download
      MAX_BULK_DOWNLOAD_COUNT: ${MAX_BULK_DOWNLOAD_COUNT}
      BULK_DOWNLOAD_ACTIVE_JOBS_LIMIT: ${BULK_DOWNLOAD_ACTIVE_JOBS_LIMIT}
      BULK_DOWNLOAD_DAILY_LIMIT: ${BULK_DOWNLOAD_DAILY_LIMIT}
      MINIO_BUCKET_DOWNLOADS: ${MINIO_BUCKET_DOWNLOADS}
      BULK_DOWNLOAD_ZIP_EXPIRY_DAYS: ${BULK_DOWNLOAD_ZIP_EXPIRY_DAYS}

  worker:
    networks:
      - memegy-network
    image: ${BACKEND_IMAGE}
    pull_policy: always
    container_name: memegy_prod_worker
    restart: always
    command: ["/app/worker"]
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # Server
      RUST_LOG: ${RUST_LOG}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET}
      ENVIRONMENT: ${ENVIRONMENT}
      REQUIRE_CLOUDFLARE_HEADERS: ${REQUIRE_CLOUDFLARE_HEADERS}

      # Token TTLs
