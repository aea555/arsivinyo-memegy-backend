      # Download
      DOWNLOAD_RPM_LIMIT: ${DOWNLOAD_RPM_LIMIT}
      DOWNLOAD_BANDWIDTH_HOURLY_MB: ${DOWNLOAD_BANDWIDTH_HOURLY_MB}
      PRESIGNED_DOWNLOAD_URL_EXPIRY_SECS: ${PRESIGNED_DOWNLOAD_URL_EXPIRY_SECS}
      DOWNLOAD_REFRESH_RPM_LIMIT: ${DOWNLOAD_REFRESH_RPM_LIMIT}

      # Bulk Download
      MAX_BULK_DOWNLOAD_COUNT: ${MAX_BULK_DOWNLOAD_COUNT}
      BULK_DOWNLOAD_ACTIVE_JOBS_LIMIT: ${BULK_DOWNLOAD_ACTIVE_JOBS_LIMIT}
      BULK_DOWNLOAD_DAILY_LIMIT: ${BULK_DOWNLOAD_DAILY_LIMIT}
      MINIO_BUCKET_DOWNLOADS: ${MINIO_BUCKET_DOWNLOADS}
      BULK_DOWNLOAD_ZIP_EXPIRY_DAYS: ${BULK_DOWNLOAD_ZIP_EXPIRY_DAYS}

networks:
  memegy-network:
    driver: bridge
