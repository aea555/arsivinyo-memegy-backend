[package]
name = "worker"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
migration = { path = "../shared/migration" }

tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sea-orm = "1.1.19"
sea-orm-migration = "1.1.19"
uuid = "1.20.0"
anyhow = "1.0.100"
tempfile = "3.14.0"
redis = { version = "1.0.2", features = ["tokio-comp"] }
zip = "0.6"
chrono = "0.4"
serde_json = "1.0"
